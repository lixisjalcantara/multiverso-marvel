        }

        /* Conectores visuales para Grid */
        .timeline-card { position: relative; }
        @media (min-width: 1024px) { 
            .timeline-card:not(:nth-child(3n))::after {
                content: ''; position: absolute; top: 50%; right: -24px; width: 24px; height: 2px;
                background: linear-gradient(90deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.04));
                z-index: 1; pointer-events: none;
            }
            .timeline-card:not(:nth-child(3n))::before {
                content: '►'; position: absolute; top: 50%; right: -27px; transform: translateY(-50%);
                color: rgba(255, 255, 255, 0.3); font-size: 10px; z-index: 2; pointer-events: none;
            }

            .timeline-doomsday:not(:nth-child(3n))::after {
                background: linear-gradient(90deg, rgba(16, 185, 129, 0.5), rgba(16, 185, 129, 0.15));
            }
            .timeline-doomsday:not(:nth-child(3n))::before {
                color: #10b981;
                text-shadow: 0 0 8px rgba(16, 185, 129, 0.8);
            }
        }
        @media (min-width: 768px) and (max-width: 1023px) { 
            .timeline-card:not(:nth-child(2n))::after {
                content: ''; position: absolute; top: 50%; right: -20px; width: 20px; height: 2px;
                background: linear-gradient(90deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.04));
                pointer-events: none;
            }
            .timeline-doomsday:not(:nth-child(2n))::after {
                background: linear-gradient(90deg, rgba(16, 185, 129, 0.5), rgba(16, 185, 129, 0.15));
            }
        }
        @media (max-width: 767px) { 
            .timeline-card:not(:last-child)::after {
                content: ''; position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%);
                width: 2px; height: 20px;
                background: linear-gradient(180deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.04));

            .timeline-doomsday:not(:last-child)::after {
                background: linear-gradient(180deg, rgba(16, 185, 129, 0.5), rgba(16, 185, 129, 0.15));
            }
        }

                if (diff <= 0) return { days: 0, hours: 0, minutes: 0, seconds: 0 };
                return {
                    days: Math.floor(diff / (1000 * 60 * 60 * 24)),
                    hours: Math.floor((diff / (1000 * 60 * 60)) % 24),
                    minutes: Math.floor((diff / (1000 * 60)) % 60),
                    seconds: Math.floor((diff / 1000) % 60),
                };
            };

                    setCountdownDoomsday(calculateTimeRemaining(DOOMSDAY_TARGET));

                return () => clearInterval(timer);

                                                        : 'border-zinc-700 bg-black/50 text-transparent hover:text-zinc-400 hover:border-zinc-500'
                                                }`}
                                            >
                                                <i className="fa-solid fa-check text-xs"></i>
                                            </button>
                                        </div>
                                        
                                        <div className="flex-1 flex flex-col justify-between">
                                            <div>
                                                <h3 className={`font-black text-lg leading-tight mb-1 transition-colors ${isWatched ? 'line-through text-zinc-500' : 'text-white'}`}>
                                                    {item.tEs}
                                                </h3>
                                                <div className="flex items-center gap-2 mb-3">
                                                    <span className={`badge-neon text-[10px] px-2 py-0.5 rounded-md uppercase ${getUniBadgeStyle(item.uni)}`}>
                                                        {item.uni}
                                                    </span>
                                                    <h4 className="text-xs text-zinc-400 italic truncate max-w-[200px]">{item.tEn}</h4>
                                                </div>
                                            </div>
                                            
                                            <div className="pt-2.5 border-t border-white/5 flex flex-wrap items-center gap-2 text-[11px] font-semibold text-zinc-400">
                                                <span className={`badge-neon px-2 py-0.5 rounded-md flex items-center gap-1 ${getFormatBadgeStyle(item.ty)}`}>
                                                    {item.ty === 'movie' && <i className="fa-solid fa-film text-xs mr-1"></i>}
                                                    {item.ty === 'series' && <i className="fa-solid fa-tv text-xs mr-1"></i>}
                                                    {item.ty === 'oneshot' && <i className="fa-solid fa-bolt text-xs mr-1"></i>}
                                                    <span className="capitalize">{item.ty === 'oneshot' ? 'One-Shot' : item.ty === 'movie' ? 'Película' : `Serie (${item.s}T)`}</span>
                                                </span>

                                                <span className="flex items-center gap-1 bg-black/50 px-2 py-0.5 rounded-md border border-white/10 font-mono text-zinc-300">
                                                    <i className="fa-regular fa-clock text-zinc-500 mr-0.5"></i>
                                                    {item.d > 1000 ? Math.round(item.d/60) + 'h' : item.d + 'm'}
                                                </span>

                                                {item.pc > 0 && (
                                                    <span className={`flex items-center gap-1 px-2 py-0.5 rounded-md font-mono ${accentText} bg-black/50 border border-white/10`}>
                                                        <i className="fa-solid fa-ticket mr-0.5"></i>
                                                        {item.pc} {item.pc === 1 ? 'Post' : 'Posts'}
                                                    </span>
                                                )}
                                            </div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>

                        {/* SECCIÓN COUNTDOWN CLÍMAX INFERIOR: LA META TRAS LAS 103 PRODUCCIONES */}
                        {renderCountdown(true)}
                    </main>

                    {/* MODAL EXPEDIENTE S.H.I.E.L.D. */}
                    {selectedItem && (
                        <div className="fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-4 backdrop-blur-2xl" onClick={() => setSelectedItem(null)}>
                            <div 
                                className={`bg-[#07090d] border ${
                                    selectedItem.cr 
                                        ? 'border-emerald-500/70 shadow-[0_0_50px_rgba(16,185,129,0.3)]' 
                                        : 'border-red-500/50 shadow-[0_0_50px_rgba(237,29,36,0.25)]'
                                } rounded-3xl max-w-xl w-full relative modal-shield-enter overflow-hidden`} 
                                onClick={e => e.stopPropagation()}
                            >
                                <div className="absolute inset-0 shield-scanlines pointer-events-none"></div>

                                <div className="bg-black/90 px-5 py-4 border-b border-white/10 flex items-center justify-between relative z-20">
                                    <div className="flex items-center gap-3">
                                        <div className={`p-2 rounded-xl border ${selectedItem.cr ? 'border-emerald-500/40 bg-emerald-950/40 text-emerald-400' : 'border-red-500/40 bg-red-950/40 text-red-400'}`}>
                                            <i className="fa-solid fa-shield-halved text-lg"></i>
                                        </div>
                                        <div>
                                            <span className="font-mono text-[10px] tracking-[0.2em] uppercase font-black text-zinc-400 block">
                                                S.H.I.E.L.D. // EXPEDIENTE MULTIVERSAL CLASIFICADO
                                            </span>
                                            <span className="font-mono text-[10px] text-zinc-500">
                                                CLEARANCE: LEVEL 9 // ARCHIVO ID-MRVL-{String(selectedItem.id).padStart(3, '0')}
                                            </span>
                                        </div>
                                    </div>
                                    <button onClick={() => setSelectedItem(null)} className="w-8 h-8 rounded-xl bg-white/5 hover:bg-white/15 text-zinc-400 hover:text-white flex items-center justify-center">
                                        <i className="fa-solid fa-xmark"></i>
                                    </button>
                                </div>
                                
                                <div className="p-6 relative z-20 space-y-6">
                                    <div className="flex items-center justify-between gap-4">
                                        <div className="flex items-center gap-2">
                                            <span className={`badge-neon text-xs px-3 py-1 rounded-lg uppercase ${getUniBadgeStyle(selectedItem.uni)}`}>
                                                {getUniLabel(selectedItem.uni)}
                                            </span>
                                            <span className={`badge-neon text-xs px-3 py-1 rounded-lg uppercase ${getFormatBadgeStyle(selectedItem.ty)}`}>
                                                {selectedItem.ty === 'movie' ? 'Largometraje' : selectedItem.ty === 'series' ? 'Serie' : 'Cortometraje'}
                                            </span>
                                        </div>

                                        {selectedItem.cr ? (
                                            <span className="badge-neon badge-doomsday text-xs px-3 py-1 rounded-lg font-black uppercase flex items-center gap-1.5 shadow-[0_0_15px_rgba(16,185,129,0.4)]">
                                                <i className="fa-solid fa-fire"></i> RUTA DOOMSDAY
                                            </span>
                                        ) : (
                                            <span className="px-2.5 py-1 rounded-lg bg-zinc-800 text-zinc-400 text-[10px] font-mono border border-zinc-700">CANON ALTERNO</span>
                                        )}
                                    </div>
                                    
                                    <div>
                                        <h2 className="text-2xl sm:text-3xl font-black text-white tracking-tight leading-tight">{selectedItem.tEs}</h2>
                                        <h3 className="text-sm text-zinc-400 italic font-medium mt-1">{selectedItem.tEn}</h3>
                                    </div>
                                    
                                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5 bg-black/60 p-3.5 rounded-2xl border border-white/10 font-mono text-xs">
                                        <div className="p-2.5 bg-zinc-950/80 rounded-xl border border-white/5">
                                            <span className="text-[10px] text-zinc-500 block uppercase">Año Canónico</span>
                                            <span className="font-bold text-white text-sm">{selectedItem.y_in === 1000 ? 'Origen' : selectedItem.y_in}</span>
                                        </div>
                                        <div className="p-2.5 bg-zinc-950/80 rounded-xl border border-white/5">
                                            <span className="text-[10px] text-zinc-500 block uppercase">Estreno en Cines</span>
                                            <span className="font-bold text-white text-sm">{selectedItem.y_out}</span>
                                        </div>
                                        <div className="p-2.5 bg-zinc-950/80 rounded-xl border border-white/5">
                                            <span className="text-[10px] text-zinc-500 block uppercase">Duración</span>
                                            <span className="font-bold text-white text-sm">{selectedItem.d > 1000 ? Math.round(selectedItem.d/60) + ' hrs' : selectedItem.d + ' min'}</span>
                                        </div>
                                        <div className="p-2.5 bg-zinc-950/80 rounded-xl border border-white/5">
                                            <span className="text-[10px] text-zinc-500 block uppercase">Post-Créditos</span>
                                            <span className={`font-bold text-sm ${selectedItem.pc > 0 ? accentText : 'text-zinc-400'}`}>{selectedItem.pc}</span>
                                        </div>
                                    </div>

                                    <div className="flex items-center gap-2 text-xs bg-black/50 px-4 py-3 rounded-2xl border border-white/5">
                                        <span className="font-mono text-zinc-500 uppercase tracking-wider text-[11px]">Dirección / Creación:</span>
                                        <span className="font-bold text-zinc-100">{selectedItem.dir}</span>
                                    </div>
                                    
                                    <div className="space-y-1.5">
                                        <div className="flex items-center justify-between text-[10px] uppercase font-mono font-bold tracking-widest text-zinc-400">
                                            <span>DESCRIPCIÓN DE MISIÓN / SINOPSIS</span>
                                            <span className="text-zinc-600">CONFIDENCIAL // NIVEL 9</span>
                                        </div>
                                        <div className="p-4 rounded-2xl bg-black/60 border border-white/10 text-sm text-zinc-300 leading-relaxed font-sans">
                                            {selectedItem.syn}
                                        </div>
                                    </div>

                                    <div className="pt-2 flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 border-t border-white/10">
                                        <button
                                            onClick={(e) => toggleWatch(e, selectedItem.id)}
                                            className={`px-5 py-2.5 rounded-xl font-bold text-xs uppercase tracking-wider flex items-center justify-center gap-2 transition-all ${
                                                watched.includes(selectedItem.id)
                                                    ? 'bg-zinc-800 text-zinc-300 border border-white/10 hover:bg-zinc-700'
                                                    : `${accentBg} text-white shadow-lg`
                                            }`}
                                        >
                                            <i className="fa-solid fa-check"></i>
                                            <span>{watched.includes(selectedItem.id) ? 'Marcado como Visto (Desmarcar)' : 'Marcar como Visto'}</span>
                                        </button>

                                        <button 
                                            onClick={() => setSelectedItem(null)} 
                                            className="px-4 py-2 rounded-xl bg-white/10 hover:bg-white/15 text-white text-xs font-semibold"
                                        >
                                            Cerrar Expediente
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
